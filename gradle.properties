# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9's built-in Kotlin support normally forbids anything touching the
# kotlin.sourceSets DSL. KSP still registers its generated sources that way, so
# Room's code generation cannot run without this escape hatch.
# Revisit once KSP registers generated sources via android.sourceSets instead.
android.disallowKotlinSourceSets=false
# Silences the sync warning for the deliberate use above, not a suppression of
# something unexamined.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# The three OneDrive workarounds that used to live here (VFS watching off,
# configuration cache off, project cache relocated) are gone: the repo moved to a
# plain local path, so Gradle can watch the tree and keep its caches in place.
#
# With the cloud file provider out of the way the configuration cache is worth
# having on rather than merely back at its default: it takes an up-to-date
# compileDebugKotlin from ~22 s to under a second, which is the inner loop.
org.gradle.configuration-cache=true
