# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9's built-in Kotlin support normally forbids anything touching the
# kotlin.sourceSets DSL. KSP still registers its generated sources that way, so
# Room's code generation cannot run without this escape hatch.
# Revisit once KSP registers generated sources via android.sourceSets instead.
android.disallowKotlinSourceSets=false

# ---------------------------------------------------------------------------
# OneDrive workarounds
#
# This project lives under ~/Library/CloudStorage/OneDrive-Personal. Gradle keeps
# several small, write-heavy binary caches next to the build, and OneDrive's cloud
# file provider intermittently fails those writes with "Operation timed out" -
# failures with no relation to any code change. The three settings below move or
# disable exactly the parts that touch the project directory that way.
#
# Moving the repository to a local path (git is the backup, not OneDrive) makes
# all three unnecessary: delete this block and remove the projectcachedir line.
# ---------------------------------------------------------------------------

# Watching the project tree through the cloud file provider times out.
org.gradle.vfs.watch=false

# Writing the configuration-cache entry walks and rewrites the project tree.
org.gradle.configuration-cache=false

# Keeps .gradle/ (checksum and file-hash B-trees) off the synced volume. This is
# an absolute path because Gradle reads it before any expansion is available.
org.gradle.projectcachedir=/home/user/.gradle/project-caches/aeroglobe
