name: Visa data refresh

# Weekly pull request that keeps the bundled visa data current. Visa-requirements
# republishes on Mondays around 04:17 UTC; this runs at 07:00 UTC, after it.
#
# It runs the same build as docs/DATA.md (tools/visa/build_visa.py), which downloads the
# published dataset and refuses to write unless every check passes. If the build fails the
# job goes red and NO pull request is opened. If the rebuilt assets differ from main in
# anything other than the "asOf" date and each passport's "sourceRevision" (Wikipedia
# revisions drift weekly, so revision drift alone opens no PR), one data/visa-YYYY-MM-DD branch and PR are opened,
# listing the changed rows; otherwise nothing is opened and any stale open data PR is closed.
# Only one data PR is open at a time: an older one is closed in favour of the new one.
#
# Merging that PR does NOT release anything. It only updates the data on main; a release is
# still cut by hand with release.yml. visa-freshness.yml stays as the alarm for what this
# job cannot decide for itself: a passport added or removed upstream and a schema change.
#
# The same build is also PUBLISHED every run (the `publish` job): the app's updater fetches
# manifest.json and visa_<code>.json from GitHub Pages, so installed apps get the new data
# without waiting for a PR to be merged or a release to be cut. tools/visa/make_site.py
# refuses to assemble the site unless every file checks out, and the build above has already
# refused to write unless its own checks passed, so a bad run publishes nothing and the
# previous deployment stays live.
#
# The publish job rebuilds from upstream independently of the data PR, so the published data can
# be newer than what is on main until the PR merges (intentional: ship as published, no app-side
# curation). visa-freshness.yml is the weekly alarm for what this workflow cannot decide itself.
#
# Repo settings needed: Settings > Pages > Source = "GitHub Actions", and
# Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". A PR opened with GITHUB_TOKEN does not trigger pull_request
# workflows, so the checks are started with `gh workflow run ci.yml` (dispatch is allowed)
# on the data branch, which attaches `test` and `lint` to its head commit.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: visa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # A dispatch from another ref must not open a PR against main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rebuild the visa assets
        run: |
          export LC_ALL=C  # glob order of visa*.json must be deterministic
          mkdir -p tools/visa/cache
          curl -fsSL --retry 3 -o tools/visa/cache/aa-travelwarning.json https://www.auswaertiges-amt.de/opendata/travelwarning
          python3 -I tools/visa/build_visa.py
          (cd app/src/main/assets && sha256sum visa*.json) > docs/visa-checksums.txt

      - name: Decide whether anything changed
        id: diff
        run: |
          # "asOf" moves on every build and "sourceRevision" on any Wikipedia edit, so
          # neither counts as a change; the revisions file still ships with a real one.
          strip() { sed -E 's/"(asOf|sourceRevision)":"[^"]*"//g'; }
          changed=false
          for f in app/src/main/assets/visa*.json; do
            if ! diff -q <(git show "HEAD:$f" 2>/dev/null | strip) \
                         <(strip < "$f") > /dev/null; then
              changed=true
              break
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then
            echo "No change in the visa data." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close stale data pull requests
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("data/visa-")) | .number' |
          while read -r N; do
            gh pr close "$N" --delete-branch --comment "Data on main now matches the latest publication."
          done

      - name: Open or update the data pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data/visa-$(date -u +%F)"
          {
            echo "Weekly refresh of the bundled visa data. Shipped as published by Visa-requirements; no app-side curation."
            echo
            echo "Merging does not release anything. Rows that differ from main (category and days):"
            echo
            echo '```'
            python3 -I tools/visa/diff_rows.py HEAD app/src/main/assets
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add app/src/main/assets docs/visa-checksums.txt docs/visa-source-revisions.txt
          git commit -m "Refresh the visa data from the latest Visa-requirements publication"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # One data PR at a time: close older ones (and drop their branches).
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select((.headRefName | startswith("data/visa-")) and .headRefName != "'"$BRANCH"'") | .number' |
          while read -r N; do
            gh pr close "$N" --delete-branch --comment "Superseded by $BRANCH."
          done

          if [ -n "$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Visa data refresh $(date -u +%F)" --body-file "$RUNNER_TEMP/body.md"
          fi

          # Start the required checks on the pushed head commit.
          gh workflow run ci.yml --ref "$BRANCH"

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Shared with advisory-refresh.yml: both deploy the whole site, so they must not overlap.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rebuild the visa assets
        run: |
          export LC_ALL=C
          mkdir -p tools/visa/cache
          curl -fsSL --retry 3 -o tools/visa/cache/aa-travelwarning.json https://www.auswaertiges-amt.de/opendata/travelwarning
          python3 -I tools/visa/build_visa.py

      - name: Assemble the site
        run: python3 -I tools/visa/make_site.py app/src/main/assets "$RUNNER_TEMP/site"

      # manifest.sig is the detached ECDSA signature the app checks before it trusts manifest.json
      # (the manifest comes from the same host as the data, so its hashes alone only catch
      # corruption). The script fails when the secret is missing or empty and verifies its own
      # output before anything is uploaded; there is deliberately no skip. The key never reaches
      # the log. Setup and rollout order: docs/DATA.md, "Signing the manifest".
      - name: Sign the manifest
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: bash tools/visa/sign_manifest.sh "$RUNNER_TEMP/site"

      # A Pages deployment replaces the whole site, so advisory.json (published weekly by
      # advisory-refresh.yml) and its heartbeat must ride along or this deploy would delete them. The
      # live copy is newest; the bundled one is only the fallback.
      - name: Carry over advisory.json and its heartbeat
        run: |
          LIVE=https://riedel-david.github.io/Beyond-Borders
          SITE="$RUNNER_TEMP/site"
          fetch() {  # $1 = file name; sets RC: 0 fetched, 3 not live, anything else is an error
            RC=0
            python3 -I tools/advisory/fetch_live.py "$LIVE/$1" "$SITE/$1" --probe "$LIVE/manifest.json" || RC=$?
          }
          use_bundled() {  # $1 = why
            python3 -I tools/advisory/make_site.py --check app/src/main/assets/advisory.json
            cp app/src/main/assets/advisory.json "$SITE/advisory.json"
            echo "::warning::advisory.json: $1; used the bundled copy."
            echo "- advisory.json: $1; the bundled copy was published." >> "$GITHUB_STEP_SUMMARY"
          }
          fetch advisory.json
          if [ "$RC" = 0 ]; then
            if python3 -I tools/advisory/make_site.py --check "$SITE/advisory.json"; then
              echo "Carried over the live advisory.json."
            else
              # A live file that does not validate would otherwise block every visa publication
              # until someone fixes the advisory side. The bundled copy is valid (CI checks it) and
              # replaces it; advisory-refresh.yml repairs the live file on its next run.
              use_bundled "the live copy does not validate"
            fi
          elif [ "$RC" = 3 ]; then
            # Not published yet (404, or Pages' first-request 503 on an up site): the bundled copy.
            use_bundled "none published yet"
          else
            # Any other status or an unreachable site: stop. The previous deployment, which still
            # has the live advisory.json, stays up. Falling back to the bundled copy here could
            # replace a newer live file with an older one without anyone noticing.
            exit 1
          fi
          fetch advisory-heartbeat.json
          if [ "$RC" = 0 ]; then
            python3 -I tools/advisory/make_site.py --check-heartbeat "$SITE/advisory-heartbeat.json" --max-age-days 100000 \
              || { echo "::warning::advisory-heartbeat.json is unreadable; not carried over"; rm -f "$SITE/advisory-heartbeat.json"; }
          elif [ "$RC" = 3 ]; then
            echo "No live heartbeat yet (advisory-refresh.yml has not published one)."
          else
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      # See the script: deploy-pages can look before GitHub lists the artifact just uploaded.
      - name: Wait until the uploaded artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/wait_for_pages_artifact.sh

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # One notification for either job. Scheduled runs only: a manual dispatch is watched
  # by whoever started it, and an issue nobody closes is worse than none. visa-freshness.yml
  # (Mondays, after this) separately catches a stale published site. The token is
  # widened here only, not for the jobs that build and deploy.
  notify:
    needs: [refresh, publish]
    if: ${{ always() && github.event_name == 'schedule' && (needs.refresh.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFRESH: ${{ needs.refresh.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          TITLE="Visa data refresh failed"
          FAILED=""
          [ "$REFRESH" = failure ] && FAILED="refresh"
          [ "$PUBLISH" = failure ] && FAILED="${FAILED:+$FAILED and }publish"
          BODY="The $FAILED job failed: $RUN_URL"
          N="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n 1)"
          if [ -z "$N" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY Steps: docs/DATA.md."
          else
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
