name: Advisory data refresh

# Weekly publication of advisory.json (US State Department, UK FCDO and Auswärtiges Amt travel
# advisories, tools/advisory/build_advisory.py) to the GitHub Pages site that already serves the
# visa data. Advisories change on any day, so this runs mid-week (Wednesday 06:30 UTC), clear of
# visa-refresh (Monday 07:00) and visa-freshness (Monday 09:30).
#
# The same run also opens a weekly data pull request (the `pull-request` job) that keeps the copy
# bundled in the app for first run and offline (app/src/main/assets/advisory.json) current, like
# visa-refresh.yml does for the visa data. It rebuilds independently of `publish` (so the PR and the
# published file can differ by a few minutes of feed drift, as with visa) and needs neither job the
# other: a failing PR job does not stop the publication installed apps depend on, and the other way
# round. The PR is opened only when the rebuilt file differs from main in anything but generatedAt
# and the sources' fetchedAt (tools/advisory/data_pr.py), on one data/advisory-YYYY-MM-DD branch; an
# older open one is closed in favour of it, and a stale one is closed when main already matches.
# Merging it does NOT release anything. Only branches starting data/advisory- are touched here;
# visa-refresh.yml owns data/visa-, so the two never close each other's pull requests.
#
# A Pages deployment replaces the WHOLE site, so this job does not deploy advisory.json alone. It
# assembles one site holding advisory.json and the visa files that are live right now
# (tools/advisory/make_site.py, which checks them against the live manifest's sha256), and
# visa-refresh.yml's publish job does the mirror image by carrying the live advisory.json. Both
# publish jobs share one concurrency group so the later one always reads what the earlier deployed.
#
# The build refuses to write unless every feed is reachable and plausible and every country maps to
# an ISO code, and the site assembly refuses unless the live visa files verify, so a bad run
# deploys nothing and the previous site stays live. A failed scheduled run opens (or comments on)
# one issue, like visa-refresh.yml, carrying the build's own error text.
#
# Every run also publishes advisory-heartbeat.json (tools/advisory/make_site.py). advisory.json does
# not change in a quiet week, so it cannot show that this job still runs; the heartbeat can, and
# visa-freshness.yml fails when it is older than 10 days.
#
# Repo settings needed besides Pages (see visa-refresh.yml): Settings > Actions > General > "Allow
# GitHub Actions to create and approve pull requests". A PR opened with GITHUB_TOKEN does not
# trigger pull_request workflows, so the checks are started with `gh workflow run ci.yml` on the
# data branch.
on:
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-refresh
  cancel-in-progress: false

jobs:
  publish:
    # A dispatch from another ref must not deploy to the production site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      error: ${{ steps.explain.outputs.error }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # "Data as of" must move only when an advisory does. The build judges "unchanged" against the
      # previous file, and that is the live published copy, not the bundled one (which stops matching
      # after the first publication and would make every week look changed).
      - name: Fetch the live advisory.json as the previous file
        run: |
          # Not live yet (404, or Pages' first-request 503 that outlasts the retries on a site that
          # is up): the bundled copy is the previous file. Any other failure fails the job, like the
          # carry-over step in visa-refresh.yml. tools/advisory/fetch_live.py says which is which.
          PREV="$RUNNER_TEMP/previous-advisory.json"
          RC=0
          python3 -I tools/advisory/fetch_live.py https://riedel-david.github.io/Beyond-Borders/advisory.json "$PREV" \
            --probe https://riedel-david.github.io/Beyond-Borders/manifest.json || RC=$?
          if [ "$RC" = 0 ]; then
            echo "ADVISORY_PREVIOUS=$PREV" >> "$GITHUB_ENV"
          elif [ "$RC" = 3 ]; then
            echo "No live advisory.json; the bundled copy is the previous file."
          else
            exit 1
          fi

      - name: Build advisory.json
        run: |
          set -o pipefail  # the build's exit code must survive the tee
          python3 -m unittest discover -s tools/advisory -p 'test_*.py'
          # The build's own words (a tripwire on an unreviewed German sentence, an unmapped country)
          # go to the log, the job summary and the failure issue.
          python3 -I tools/advisory/build_advisory.py --quarantine-out "$RUNNER_TEMP/quarantine.json" ${ADVISORY_PREVIOUS:+--previous "$ADVISORY_PREVIOUS"} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Warnings (the count of advised-against countries moved a lot, a situation flag appeared) do
      # not fail the run, so they would be lost in the log: put them where a person looks.
      - name: Show the build's warnings
        if: always()
        run: |
          # The withheld German entries have their own step below; echoed page text loses its backticks.
          W="$(grep '^warning:' "$RUNNER_TEMP/build.log" 2>/dev/null | grep -vE '^warning: (DE .* withheld|German entries withheld)' | tr -d '`' | cut -c1-400 || true)"
          if [ -n "$W" ]; then
            { echo "### Advisory build warnings"; echo '```'; echo "$W"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A withheld German entry needs no action, but it must not be visible only in a PR that may
      # not open: say so in the summary and as an annotation. Never fails the job.
      - name: Show the withheld German entries
        if: always()
        run: |
          F="$RUNNER_TEMP/quarantine.json"
          [ -f "$F" ] || exit 0
          LINES="$(python3 -I tools/advisory/data_pr.py withheld "$F")"
          if [ -n "$LINES" ]; then
            { echo "### German advisory entries withheld this week"; echo '```'; echo "$LINES"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            CODES="$(python3 -I tools/advisory/data_pr.py withheld-codes "$F")"
            if [ -n "$CODES" ]; then
              echo "::warning::German advisory entries withheld this week: $CODES"
            fi
          fi

      - name: Assemble the site with the live visa files
        run: |
          set -o pipefail  # make_site.py's exit code must survive the tee
          # Same log as the build, so a refusal here (live visa files that do not verify) reaches
          # the summary and the issue too.
          python3 -I tools/advisory/make_site.py app/src/main/assets/advisory.json https://riedel-david.github.io/Beyond-Borders/ "$RUNNER_TEMP/site" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Explain the failure
        id: explain
        if: failure()
        run: |
          # Backticks are removed so the text cannot close the issue's code fence, and it sits in a
          # fence so a feed sentence containing an @name pings nobody.
          TEXT="$( { [ -f "$RUNNER_TEMP/build.log" ] && tail -n 25 "$RUNNER_TEMP/build.log" || echo "(no build output: the failure was before the build ran, or in a step that does not log)"; } | tr -d '`' | cut -c1-600 | head -c 3000)"
          { echo "### Advisory refresh failed"; echo '```'; echo "$TEXT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The text comes from feed content, so the delimiter is random per run and regenerated
          # if the text happens to contain it: a fixed one could be forged to end the output early.
          DELIM="EOF_$(openssl rand -hex 16)"
          while printf '%s' "$TEXT" | grep -qF "$DELIM"; do DELIM="EOF_$(openssl rand -hex 16)"; done
          {
            echo "error<<$DELIM"
            echo "$TEXT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

  # Keeps the bundled copy current. No `needs` either way (see the header). It never deploys Pages,
  # so it sits outside the pages-publish concurrency group. The token is widened here only.
  pull-request:
    # A dispatch from another ref must not open a PR against main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      error: ${{ steps.explain.outputs.error }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build overwrites the bundled file, so main's copy is kept aside to compare against.
      - name: Rebuild advisory.json
        run: |
          set -o pipefail  # the build's exit code must survive the tee
          git show HEAD:app/src/main/assets/advisory.json > "$RUNNER_TEMP/main-advisory.json"
          python3 -m unittest discover -s tools/advisory -p 'test_*.py'
          # Judged against main's file (the build's default), so a week without a change leaves it
          # identical. A failed build writes nothing and the job goes red with no PR.
          python3 -I tools/advisory/build_advisory.py --quarantine-out "$RUNNER_TEMP/quarantine.json" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show the build's warnings
        if: always()
        run: |
          # The withheld German entries have their own step below; echoed page text loses its backticks.
          W="$(grep '^warning:' "$RUNNER_TEMP/build.log" 2>/dev/null | grep -vE '^warning: (DE .* withheld|German entries withheld)' | tr -d '`' | cut -c1-400 || true)"
          if [ -n "$W" ]; then
            { echo "### Advisory build warnings"; echo '```'; echo "$W"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the withheld German entries
        if: always()
        run: |
          F="$RUNNER_TEMP/quarantine.json"
          [ -f "$F" ] || exit 0
          LINES="$(python3 -I tools/advisory/data_pr.py withheld "$F")"
          if [ -n "$LINES" ]; then
            { echo "### German advisory entries withheld this week"; echo '```'; echo "$LINES"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            CODES="$(python3 -I tools/advisory/data_pr.py withheld-codes "$F")"
            if [ -n "$CODES" ]; then
              echo "::warning::German advisory entries withheld this week: $CODES"
            fi
          fi

      - name: Decide whether anything changed
        id: diff
        run: |
          changed="$(python3 -I tools/advisory/data_pr.py changed "$RUNNER_TEMP/main-advisory.json" app/src/main/assets/advisory.json)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then
            echo "No change in the advisory data." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close stale data pull requests
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("data/advisory-")) | .number' |
          while read -r N; do
            gh pr close "$N" --delete-branch --comment "Data on main now matches the latest advisories."
          done

      - name: Open or update the data pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH="data/advisory-$(date -u +%F)"
          {
            echo "Weekly refresh of the bundled travel advisories (US State Department, UK FCDO, Auswärtiges Amt). Shipped as published; no app-side curation."
            echo
            echo "Merging does not release anything. Countries that differ from main:"
            echo
            echo '```'
            python3 -I tools/advisory/data_pr.py body "$RUNNER_TEMP/main-advisory.json" app/src/main/assets/advisory.json --quarantine "$RUNNER_TEMP/quarantine.json"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add app/src/main/assets/advisory.json
          git commit -m "Refresh the bundled advisories from the latest US, UK and German publications"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # One data PR at a time: close older ones (and drop their branches).
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select((.headRefName | startswith("data/advisory-")) and .headRefName != "'"$BRANCH"'") | .number' |
          while read -r N; do
            gh pr close "$N" --delete-branch --comment "Superseded by $BRANCH."
          done

          if [ -n "$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Advisory data refresh $(date -u +%F)" --body-file "$RUNNER_TEMP/body.md"
          fi

          # Start the required checks on the pushed head commit.
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Explain the failure
        id: explain
        if: failure()
        run: |
          TEXT="$( { [ -f "$RUNNER_TEMP/build.log" ] && tail -n 25 "$RUNNER_TEMP/build.log" || echo "(no build output: the failure was before the build ran, or in a step that does not log)"; } | tr -d '`' | cut -c1-600 | head -c 3000)"
          { echo "### Advisory data pull request failed"; echo '```'; echo "$TEXT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The text comes from feed content, so the delimiter is random per run and regenerated
          # if the text happens to contain it: a fixed one could be forged to end the output early.
          DELIM="EOF_$(openssl rand -hex 16)"
          while printf '%s' "$TEXT" | grep -qF "$DELIM"; do DELIM="EOF_$(openssl rand -hex 16)"; done
          {
            echo "error<<$DELIM"
            echo "$TEXT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

  # Scheduled runs only: a manual dispatch is watched by whoever started it, and an issue nobody
  # closes is worse than none. The token is widened here only, not for the job that deploys.
  notify:
    needs: [publish, pull-request]
    if: ${{ always() && github.event_name == 'schedule' && (needs.publish.result == 'failure' || needs.pull-request.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH: ${{ needs.publish.result }}
          PR: ${{ needs.pull-request.result }}
          PUBLISH_ERROR: ${{ needs.publish.outputs.error }}
          PR_ERROR: ${{ needs.pull-request.outputs.error }}
        run: |
          TITLE="Advisory data refresh failed"
          FAILED=""
          [ "$PUBLISH" = failure ] && FAILED="publish"
          [ "$PR" = failure ] && FAILED="${FAILED:+$FAILED and }pull-request"
          BODY="The $FAILED job failed: $RUN_URL"
          # Two jobs can fail on the same bad feed; the text is the same then, so show it once.
          for ERR in "$PUBLISH_ERROR" "$PR_ERROR"; do
            if [ -n "$ERR" ] && [ "$ERR" != "${SHOWN:-}" ]; then
              BODY="$BODY"$'\n\n```\n'"$ERR"$'\n```\n'
              SHOWN="$ERR"
            fi
          done
          N="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n 1)"
          if [ -z "$N" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY Steps: docs/DATA.md."
          else
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
