name: Advisory data refresh

# Weekly publication of advisory.json (US State Department, UK FCDO and Auswärtiges Amt travel
# advisories, tools/advisory/build_advisory.py) to the GitHub Pages site that already serves the
# visa data. Advisories change on any day, so this runs mid-week (Wednesday 06:30 UTC), clear of
# visa-refresh (Monday 07:00) and visa-freshness (Monday 09:30).
#
# Publish only, no pull request: the app bundles a copy for first run and offline, refreshed by hand
# with the same build (docs/DATA.md).
#
# A Pages deployment replaces the WHOLE site, so this job does not deploy advisory.json alone. It
# assembles one site holding advisory.json and the visa files that are live right now
# (tools/advisory/make_site.py, which checks them against the live manifest's sha256), and
# visa-refresh.yml's publish job does the mirror image by carrying the live advisory.json. Both
# publish jobs share one concurrency group so the later one always reads what the earlier deployed.
#
# The build refuses to write unless every feed is reachable and plausible and every country maps to
# an ISO code, and the site assembly refuses unless the live visa files verify, so a bad run
# deploys nothing and the previous site stays live. A failed scheduled run opens (or comments on)
# one issue, like visa-refresh.yml, carrying the build's own error text.
#
# Every run also publishes advisory-heartbeat.json (tools/advisory/make_site.py). advisory.json does
# not change in a quiet week, so it cannot show that this job still runs; the heartbeat can, and
# visa-freshness.yml fails when it is older than 10 days.
on:
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-refresh
  cancel-in-progress: false

jobs:
  publish:
    # A dispatch from another ref must not deploy to the production site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      error: ${{ steps.explain.outputs.error }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # "Data as of" must move only when an advisory does. The build judges "unchanged" against the
      # previous file, and that is the live published copy, not the bundled one (which stops matching
      # after the first publication and would make every week look changed).
      - name: Fetch the live advisory.json as the previous file
        run: |
          # Not live yet (404, or Pages' first-request 503 that outlasts the retries on a site that
          # is up): the bundled copy is the previous file. Any other failure fails the job, like the
          # carry-over step in visa-refresh.yml. tools/advisory/fetch_live.py says which is which.
          PREV="$RUNNER_TEMP/previous-advisory.json"
          RC=0
          python3 -I tools/advisory/fetch_live.py https://riedel-david.github.io/Beyond-Borders/advisory.json "$PREV" \
            --probe https://riedel-david.github.io/Beyond-Borders/manifest.json || RC=$?
          if [ "$RC" = 0 ]; then
            echo "ADVISORY_PREVIOUS=$PREV" >> "$GITHUB_ENV"
          elif [ "$RC" = 3 ]; then
            echo "No live advisory.json; the bundled copy is the previous file."
          else
            exit 1
          fi

      - name: Build advisory.json
        run: |
          set -o pipefail  # the build's exit code must survive the tee
          python3 -m unittest discover -s tools/advisory -p 'test_*.py'
          # The build's own words (a tripwire on an unreviewed German sentence, an unmapped country)
          # go to the log, the job summary and the failure issue.
          python3 -I tools/advisory/build_advisory.py ${ADVISORY_PREVIOUS:+--previous "$ADVISORY_PREVIOUS"} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Warnings (the count of advised-against countries moved a lot, a situation flag appeared) do
      # not fail the run, so they would be lost in the log: put them where a person looks.
      - name: Show the build's warnings
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ] && grep -q '^warning:' "$RUNNER_TEMP/build.log"; then
            { echo "### Advisory build warnings"; echo '```'; grep '^warning:' "$RUNNER_TEMP/build.log" | cut -c1-400; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Explain the failure
        id: explain
        if: failure()
        run: |
          # Backticks are removed so the text cannot close the issue's code fence, and it sits in a
          # fence so a feed sentence containing an @name pings nobody.
          TEXT="$( { [ -f "$RUNNER_TEMP/build.log" ] && tail -n 25 "$RUNNER_TEMP/build.log" || echo "(no build output: the failure was before the build ran)"; } | tr -d '`' | cut -c1-600 | head -c 3000)"
          { echo "### Advisory refresh failed"; echo '```'; echo "$TEXT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "error<<END_OF_ERROR"
            echo "$TEXT"
            echo "END_OF_ERROR"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble the site with the live visa files
        run: python3 -I tools/advisory/make_site.py app/src/main/assets/advisory.json https://riedel-david.github.io/Beyond-Borders/ "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Scheduled runs only: a manual dispatch is watched by whoever started it, and an issue nobody
  # closes is worse than none. The token is widened here only, not for the job that deploys.
  notify:
    needs: [publish]
    if: ${{ always() && github.event_name == 'schedule' && needs.publish.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_ERROR: ${{ needs.publish.outputs.error }}
        run: |
          TITLE="Advisory data refresh failed"
          BODY="The publish job failed: $RUN_URL"
          if [ -n "$BUILD_ERROR" ]; then
            BODY="$BODY"$'\n\n```\n'"$BUILD_ERROR"$'\n```\n'
          fi
          N="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n 1)"
          if [ -z "$N" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY Steps: docs/DATA.md."
          else
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
