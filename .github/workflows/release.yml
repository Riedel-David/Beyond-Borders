name: Release

# Manual, from main: a read-only test job runs first, then the write job. Actions -> Release -> Run workflow. The tag is read from versionName
# in app/build.gradle.kts, so bump the version first; the run fails if that tag
# already exists rather than overwriting a release. The release is a draft unless
# "draft" is unticked, so the APK can be looked at before anyone can download it.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (markdown). Empty = auto-generated from merged PRs.
        required: false
        default: ""
      draft:
        description: Create as a draft, to publish by hand after checking it
        type: boolean
        default: true
      aab:
        description: Also build the Play bundle (AAB), kept as a private workflow artifact, not on the release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

  release:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Read version and refuse an existing tag
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists; bump versionName first." >&2
            exit 1
          fi
          # The README's download link names the versioned APK, so it goes stale on
          # every release unless it is bumped together with versionName.
          if ! grep -qF "releases/download/v$VERSION/BeyondBorders-$VERSION.apk" README.md; then
            echo "README.md download link does not point at v$VERSION; update it first." >&2
            exit 1
          fi

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK (and AAB if asked)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          WITH_AAB: ${{ inputs.aab }}
        run: |
          TASKS=(:app:assembleRelease)
          if [ "$WITH_AAB" = "true" ]; then TASKS+=(:app:bundleRelease); fi
          ./gradlew "${TASKS[@]}"

      # Fails the run if the APK is unsigned or its signature does not check out, and
      # prints the certificate digest to compare with the key given to Play App Signing.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs --verbose app/build/outputs/apk/release/app-release.apk

      # The AAB is what Play takes; same key as the APK. jarsigner prints "jar verified"
      # only for a bundle whose signature checks out, and the digest below should match
      # the one apksigner printed above.
      - name: Verify bundle signature
        if: inputs.aab
        run: |
          OUT=$(jarsigner -verify -certs -verbose app/build/outputs/bundle/release/app-release.aab)
          echo "$OUT" | tail -5
          echo "$OUT" | grep -q "jar verified" || { echo "AAB signature did not verify" >&2; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          DRAFT: ${{ inputs.draft }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BeyondBorders-$VERSION.apk"
          sha256sum "BeyondBorders-$VERSION.apk" > "BeyondBorders-$VERSION.apk.sha256"
          ARGS=(--title "Beyond Borders $VERSION" --target "$GITHUB_SHA")
          if [ -n "$NOTES" ]; then ARGS+=(--notes "$NOTES"); else ARGS+=(--generate-notes); fi
          if [ "$DRAFT" = "true" ]; then ARGS+=(--draft); fi
          gh release create "v$VERSION" "BeyondBorders-$VERSION.apk" "BeyondBorders-$VERSION.apk.sha256" "${ARGS[@]}"

      # Not attached to the release: Play is the only consumer, and the public page
      # should offer one installable file. Download it from this run's page.
      - name: Keep the AAB as a private artifact
        if: inputs.aab
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BeyondBorders-${{ env.VERSION }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
